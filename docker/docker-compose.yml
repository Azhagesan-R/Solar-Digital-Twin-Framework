services:
  # --- DATA ENGINEERING PLATFORM ---
  spark:
    build:
      context: ..
      dockerfile: docker/spark.dockerfile
    container_name: solar-spark
    # Safe interactive bash execution thread loop keeps the container alive persistently
    entrypoint: ["/bin/bash"]
    command: ["-c", "while true; do sleep 30; done"]
    volumes:
      # Unified source code mount
      - ../data_preprocessing:/opt/project/src
      # Dataset mount directories
      - ../datasets/Power_Generation_Weather:/opt/project/raw_data/telemetry
      - ../datasets/Anamoly_Detection:/opt/project/raw_data/anomalies
    ports:
      - "8085:8080"
    networks:
      - mtech-term4

  # --- STREAMING PIPELINE CONFIGURATION (ZOOKEEPER-FREE KRAFT MODE) ---
  lab-kafka-1:
    image: apache/kafka:3.7.0
    container_name: lab-kafka-1
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://lab-kafka-1:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@lab-kafka-1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - mtech-term4

networks:
  mtech-term4:
    driver: bridge

